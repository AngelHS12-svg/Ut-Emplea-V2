<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Integral · TalentLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/public/css/admin-child.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #0e312d;
            --accent: #c2914f;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #334155;
            line-height: 1.6;
            padding: 20px;
        }

        .manual-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .manual-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 50px 60px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border-top: 6px solid var(--primary);
        }

        .manual-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 30px;
            margin-bottom: 40px;
        }

        .manual-header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .manual-header .subtitle {
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 600;
            font-style: italic;
        }

        h2 {
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        p, ul {
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        ul {
            padding-left: 25px;
        }

        li {
            margin-bottom: 8px;
        }

        .manual-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
            margin-top: 50px;
        }

        @media print {
            .manual-actions { display: none; }
            body { background: white; padding: 0; }
            .manual-container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="manual-actions">
        <button class="btn btn-primary" onclick="descargarManualPDF()">
            <i class="fas fa-file-pdf"></i> Exportar a PDF
        </button>
    </div>

    <div id="manualContent" class="manual-container">
        <div class="manual-header">
            <h1>TalentLink</h1>
            <div class="subtitle">Manual de Usuario Técnico y Operativo</div>
        </div>

        <div id="manualTextParsed">
            <!-- El contenido dinámico se cargará aquí -->
        </div>

        <div class="manual-footer">
            © 2026 TalentLink by UT de Oriental | Documentación Oficial del Sistema
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const rawText = {{ contenido | tojson | safe }};
            const lines = rawText.split('\n');
            let htmlStr = '';
            let listActive = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith("===") || line.startsWith("---")) continue;

                // Detectar encabezados (mayúsculas)
                if (line === line.toUpperCase() && line.length > 5) {
                    if (listActive) { htmlStr += '</ul>'; listActive = false; }
                    htmlStr += '<h2>' + line + '</h2>';
                }
                // Detectar listas
                else if (line.match(/^[\-\*]\s|^[0-9]+\.\s/)) {
                    if (!listActive) { htmlStr += '<ul>'; listActive = true; }
                    htmlStr += '<li>' + line.replace(/^[\-\*\d\.]+\s/, '') + '</li>';
                }
                // Párrafos
                else {
                    if (listActive) { htmlStr += '</ul>'; listActive = false; }
                    htmlStr += '<p>' + line + '</p>';
                }
            }
            if (listActive) htmlStr += '</ul>';
            document.getElementById("manualTextParsed").innerHTML = htmlStr;
        });

        function descargarManualPDF() {
            const element = document.getElementById('manualContent');
            const opt = {
                margin: 10,
                filename: 'Manual_TalentLink_V2.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
