services:
  # Servicio de Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: ut_emplea_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolsa_trabajo_uto"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio de la Aplicación Web (Flask + Gunicorn)
  web:
    build: .
    container_name: ut_emplea_web
    restart: always
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-5432}
      - FLASK_ENV=${FLASK_ENV:-production}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy
    # El puerto 5000 ya NO se expone directamente al exterior,
    # solo Nginx puede comunicarse con la app internamente
    ports:
      - "5000:5000"

  # Servicio Nginx (Proxy Inverso + SSL)
  nginx:
    image: nginx:alpine
    container_name: ut_emplea_nginx
    restart: always
    ports:
      - "80:80"      # HTTP (redirige automáticamente a HTTPS)
      - "443:443"    # HTTPS con SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./public:/app/public:ro
      - ./nginx/certs-le:/etc/nginx/certs-le:ro
    depends_on:
      - web


volumes:
  postgres_data:
