events {
    worker_connections 1024;
}

http {
    # Redirigir todo el tráfico HTTP al HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS principal
    server {
        listen 443 ssl;
        server_name _;

        # Certificados SSL auto-firmados
        ssl_certificate     /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/cert.key;

        # Configuración de seguridad SSL
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # Tamaño máximo para subida de archivos (CVs, docs, etc.)
        client_max_body_size 20M;

        # Proxy hacia la aplicación Flask
        location / {
            proxy_pass         http://web:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Servir archivos estáticos directamente por Nginx (más rápido)
        location /public/ {
            alias /app/public/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
